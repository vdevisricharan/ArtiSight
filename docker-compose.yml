services:
  frontend:
    build:
      context: ./artisight
      dockerfile: Dockerfile
    ports:
      - "5173:80"
      - "8080:80"
    depends_on:
      - backend
    networks:
      - artisight-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "5000:5000"
    env_file:
      - ./backend/.env
    environment:
      - FLASK_APP=run.py
      - FLASK_ENV=production
      - PORT=5000
    networks:
      - artisight-network

networks:
  artisight-network:
    driver: bridge